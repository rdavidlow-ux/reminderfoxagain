<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:">
<title>ReminderFoxAgain — today</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line-strong); box-sizing: border-box; overflow: hidden; }
  .bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; background: var(--fox); color: #fff; }
  .bar img { width: 20px; height: 20px; }
  .bar h1 { font-size: 13.5px; font-weight: 650; margin: 0; flex: 1; }
  .bar .icon-btn { -webkit-app-region: no-drag; color: #fff; background: transparent; border: 0; width: 26px; height: 26px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .bar .icon-btn:hover { background: rgba(255,255,255,.18); }
  #list { flex: 1; overflow: auto; padding: 6px 10px 10px; }
  .grp { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin: 8px 2px 4px; }
  .it { display: flex; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; align-items: baseline; }
  .it:hover { background: var(--surface-2); }
  .it .tm { width: 92px; flex: none; color: var(--fox-ink); font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .it .tx { min-width: 0; flex: 1; font-size: 13.5px; }
  .it .tx small { display: block; color: var(--ink-3); font-size: 12px; }
  .it.important .tx b { color: var(--imp-ink, var(--fox-ink)); }
  .none { color: var(--ink-3); font-size: 13px; padding: 10px 4px; }
</style>
<link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="bar">
    <img src="../../assets/icon.png" alt="">
    <h1 id="title">Today</h1>
    <button class="icon-btn" id="close" title="Close">✕</button>
  </div>
  <div id="list"></div>
<script src="i18n.js"></script>
<script src="i18n-dom.js"></script>
<script src="common.js"></script>
<script src="slider.js"></script>
</body>
</html>
