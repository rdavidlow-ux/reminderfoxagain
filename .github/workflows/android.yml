# Builds the Android app (mobile/) on GitHub's servers: a debug APK to install and try, and an unsigned release APK.
# Runs on every push to the new/android-test branch, and from the Actions tab ("Run workflow").
# The APKs are under the run's "Artifacts" (ReminderFoxAgain-android).
name: Android app
on:
  push:
    branches: [new/android-test]
    paths: ['mobile/**', 'src/**', 'thunderbird/bridge.js', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Shared code (ical.js)
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
      - name: Unit tests
        run: npm test 2>&1 | tail -40 | tee -a "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
      - name: Android project
        working-directory: mobile
        run: |
          set -o pipefail
          { npm ci && node build-web.js && npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: APKs
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Name and checksum
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/ReminderFoxAgain-$V-debug.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "out/ReminderFoxAgain-$V-release-unsigned.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ReminderFoxAgain-android
          path: out/
      # the end of the log as an annotation on the commit, readable without the Actions log viewer
      - name: Report the failure
        if: failure()
        run: |
          grep -v '^\s*$' "$RUNNER_TEMP/build.log" | tail -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=Android build failed::$(cat "$RUNNER_TEMP/tail.txt")"
